; Konfigurasi PlatformIO untuk ESP32 (alternatif selain Arduino IDE).
; Arahkan src_dir ke folder smart_bin_fst agar memakai kode yang sama persis
; dengan Arduino IDE tanpa duplikasi file.

[platformio]
src_dir = smart_bin_fst

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  madhephaestus/ESP32Servo@^3.0.6
  bblanchon/ArduinoJson@^7.3.0
